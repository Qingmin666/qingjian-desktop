<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'"><title>轻笺 · 日历</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="activity-window.css"><link rel="stylesheet" href="appearance.css"></head>
<body data-expanded="false"><main class="glass" id="activity-app"><div id="capsule" role="button" tabindex="0" aria-label="展开完成日历" aria-expanded="false"><img class="capsule-logo" src="icon.svg" alt=""><span id="capsule-date">今天</span><span id="capsule-progress" class="activity-rate"></span><svg class="grid-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="4" height="4" rx=".9"/><rect x="8" y="1" width="4" height="4" rx=".9"/><rect x="15" y="1" width="4" height="4" rx=".9"/><rect x="1" y="8" width="4" height="4" rx=".9"/><rect x="8" y="8" width="4" height="4" rx=".9"/><rect x="15" y="8" width="4" height="4" rx=".9"/><rect x="1" y="15" width="4" height="4" rx=".9"/><rect x="8" y="15" width="4" height="4" rx=".9"/><rect x="15" y="15" width="4" height="4" rx=".9"/></svg></div>
  <section id="activity-menu" class="activity-menu" aria-label="完成日历" hidden>
    <div class="activity-heading"><span class="activity-title">完成日历</span><div class="activity-heading-controls"><div class="activity-tabs" role="tablist" aria-label="日历范围">
      <button type="button" role="tab" data-activity-mode="year" aria-label="年" aria-selected="true">年</button>
      <button type="button" role="tab" data-activity-mode="month" aria-label="月" aria-selected="false" tabindex="-1">月</button>
      <button type="button" role="tab" data-activity-mode="week" aria-label="周" aria-selected="false" tabindex="-1">周</button>
    </div><button id="activity-collapse" type="button" aria-label="收起日历" title="收起日历"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l5 5m-5 0h5V3m9 14l-5-5m0 5v-5h5"/></svg></button><svg class="grid-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="4" height="4" rx=".9"/><rect x="8" y="1" width="4" height="4" rx=".9"/><rect x="15" y="1" width="4" height="4" rx=".9"/><rect x="1" y="8" width="4" height="4" rx=".9"/><rect x="8" y="8" width="4" height="4" rx=".9"/><rect x="15" y="8" width="4" height="4" rx=".9"/><rect x="1" y="15" width="4" height="4" rx=".9"/><rect x="8" y="15" width="4" height="4" rx=".9"/><rect x="15" y="15" width="4" height="4" rx=".9"/></svg></div></div>
    <div class="activity-content"><div class="activity-surface"><div class="activity-body"><div id="activity-weekdays" class="activity-weekdays" aria-hidden="true"></div>
      <div id="activity-viewport" class="activity-viewport"><div id="activity-months" class="activity-months" aria-hidden="true"></div><div id="activity-chart" class="activity-chart" role="group" aria-label="完成日历"></div></div>
    </div><div class="activity-scale" aria-label="完成率从零至百分之百"><span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span></div></div>
    <div class="activity-navigation"><div><button id="activity-previous" type="button" aria-label="上一期">‹</button><span id="activity-period-label"></span><button id="activity-next" type="button" aria-label="下一期">›</button></div><button id="activity-today" type="button">今天</button></div>
    <div id="activity-selected" class="activity-selected"></div>
    </div><div id="activity-tooltip" class="activity-tooltip" role="tooltip" hidden></div>
  </section>
</main>
<div id="resize-handles" aria-hidden="true">
  <div data-resize="n"></div><div data-resize="s"></div><div data-resize="e"></div><div data-resize="w"></div>
  <div data-resize="nw"></div><div data-resize="ne"></div><div data-resize="sw"></div><div data-resize="se"></div>
</div>
<script src="activity.js"></script><script src="activity-view.js"></script><script src="font-picker.js"></script><script src="appearance.js"></script><script src="activity-window.js"></script></body></html>
